<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kotak Neo Login</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="modal-wrap">
    <section class="popup">
      <h1>Kotak Neo Login</h1>
      <p class="sub">Credentials are loaded from .venv/.kotak.env</p>
      <p class="sub">Enter current TOTP to login</p>

      {% if error %}<p class="msg error">{{ error }}</p>{% endif %}
      {% if success %}<p class="msg success">{{ success }}</p>{% endif %}

      <form method="post" action="/login">
        <input name="totp" type="text" placeholder="Enter TOTP" required />
        <button type="submit">Login</button>
      </form>
    </section>
  </main>
</body>
</html>
